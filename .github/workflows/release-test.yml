name: Release PR

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      plugins:
        description: "comma separated plugin directories"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "release-bot[bot]"
          git config user.email "release-bot[bot]@users.noreply.github.com"

      - name: Create Dummy PR
      # ブランチ作成とダミーファイルの変更
        run: |
          BRANCH_NAME="test-release-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME
          echo "Release Test at $(date)" >> release-log.txt
          
          git add release-log.txt
          git commit -m "chore: test release commit"
          git push origin $BRANCH_NAME

          # GitHub CLIでPR作成
          gh pr create \
            --title "Test Release PR #${{ github.run_id }}" \
            --body "This PR was created by GitHub App with team membership validation." \
            --base main \
            --head $BRANCH_NAME
